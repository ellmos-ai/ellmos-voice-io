[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "ellmos-voice-io"
version = "0.1.2"
description = "Local-first speech input, speech output, and wake-word helpers for LLM systems."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "ELLMOS AI" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
]
dependencies = []

[project.optional-dependencies]
stt-whisper = ["openai-whisper>=20240930"]
stt-vosk = ["vosk>=0.3.45"]
tts-pyttsx3 = ["pyttsx3>=2.98"]
tts-piper = ["piper-tts>=1.2"]
wakeword = ["openwakeword>=0.6", "pyaudio>=0.2.14", "numpy>=1.24"]
all = [
  "openai-whisper>=20240930",
  "vosk>=0.3.45",
  "pyttsx3>=2.98",
  "piper-tts>=1.2",
  "openwakeword>=0.6",
  "pyaudio>=0.2.14",
  "numpy>=1.24",
]

[project.scripts]
ellmos-voice-io = "ellmos_voice_io.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E402"]

